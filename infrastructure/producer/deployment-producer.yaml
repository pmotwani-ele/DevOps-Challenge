apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer
  namespace: producer-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-producer
  template:
    metadata:
      labels:
        app: kafka-producer
    spec:
      containers:
        - name: kafka-producer
          image: pmotwani575/kafka-producer:latest
          env:
            - name: KAFKA_BROKER_URL
              value: "kafka-cluster-kafka-bootstrap:9092"
            - name: KAFKA_TOPIC
              value: "posts"  
          ports:
            - containerPort: 8080
