apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer
  namespace: producer-ns
  labels:
    app: kafka-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-producer
  template:
    metadata:
      labels:
        app: kafka-producer
    spec:
      containers:
        - name: kafka-producer
          image: pmotwani575/kafka-producer:latest
          env:
            - name: KAFKA_BROKER_URL
              value: "kafka-cluster.kafka-project.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "test"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-producer-service
  namespace: producer-ns
spec:
  selector:
    app: kafka-producer
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
